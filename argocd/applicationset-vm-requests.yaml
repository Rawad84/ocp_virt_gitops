apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vm-requests
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Rawad84/ocp_virt_gitops.git
        revision: ocp-test
        files:
          - path: "requests/**/*.yaml"
  template:
    metadata:
      name: "vm-request-{{.path.basenameNormalized}}"
    spec:
      project: default
      sources:
        # Chart source. helm.valueFiles paths are resolved relative to THIS
        # source's own path (charts/vm-request), not the repo root — so the
        # request file (which lives outside the chart, under requests/) has
        # to be referenced via the second "ref" source below instead of a
        # plain relative path.
        - repoURL: https://github.com/Rawad84/ocp_virt_gitops.git
          targetRevision: ocp-test
          path: charts/vm-request
          helm:
            # path.path is the DIRECTORY containing the matched file (the git
            # files generator has no separate "matched filename" variable) —
            # every group folder always contains exactly one file named
            # request.yaml by convention, so that's concatenated literally.
            # $values/ resolves against the ref source below (repo root).
            valueFiles:
              - "$values/{{.path.path}}/request.yaml"
        # Ref source: same repo/revision, no path — gives $values a repo-root
        # anchor so the chart source above can reach files outside itself.
        - repoURL: https://github.com/Rawad84/ocp_virt_gitops.git
          targetRevision: ocp-test
          ref: values
      destination:
        name: "{{.cluster}}"
        # CreateNamespace=true (below) creates whatever namespace is named
        # here — without this, there's nothing for it to create, which is
        # why the first sync attempt failed with "namespaces ... not found".
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Namespace creation is idempotent and un-owned, so multiple request
          # files may safely target the same (cluster, namespace) pair.
          - CreateNamespace=true
        # Deleting/renaming a request file removes this Application but does
        # NOT cascade-delete the namespace/NAD/DataVolume/VM it created.
        preserveResourcesOnDeletion: true
