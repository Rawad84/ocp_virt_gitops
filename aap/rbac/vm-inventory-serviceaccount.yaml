# ServiceAccount + RBAC backing the "openshift-in-cluster" Credential in AAP
# Controller (see ../../ansible/aap-config/configure_controller.yml). This is
# what lets Controller's per-namespace openshift_virtualization inventory
# source read VM state from this cluster - and lets the "VM
# Post-Configuration" job (../../ansible/playbooks/postconfig.yml) patch a
# once-only annotation onto the VirtualMachine after it runs, so a rerun
# against a VM that's already been configured (e.g. a guest reboot, or a
# workflow re-launch) doesn't re-apply post-config.
#
# Cluster-scoped (ClusterRole + ClusterRoleBinding) rather than per-namespace,
# because VM request namespaces are created dynamically by
# intake_create_vm_request.yml and aren't known ahead of time - same
# credential has to keep working for every namespace, present and future.
#
# Usage:
#   1. Apply this file:
#        oc apply -f aap/rbac/vm-inventory-serviceaccount.yaml
#
#   2. Generate a token (not stored here - tokens are secrets, not committed
#      to git) and paste it into the "openshift-in-cluster" Credential's
#      "API authentication bearer token" field in AAP:
#        oc create token aap-vm-inventory -n aap --duration=8760h
#
#      --duration=8760h (~1 year) avoids the old non-expiring Secret-based
#      service account token pattern while still being long-lived enough not
#      to need frequent rotation. Re-run this command to mint a replacement
#      once it expires, and update the Credential in AAP with the new value.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aap-vm-inventory
  namespace: aap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aap-vm-inventory-reader
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  # virtualmachines gets patch/update (not just read) so postconfig.yml can
  # stamp the post-config-applied annotation on the VM after a successful
  # run - see ansible/playbooks/postconfig.yml. The VM (not the VMI) is the
  # annotation target because a VMI is deleted/recreated on stop-start, so
  # only the VM persists as the once-only marker across the VM's lifetime.
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # The redhat.openshift_virtualization.kubevirt inventory plugin also fetches
  # Services per namespace (to discover each VM's SSH-forwarding Service) -
  # without this, the sync fails with "services is forbidden" even though
  # the VM/VMI list itself would have worked fine.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aap-vm-inventory-reader-binding
subjects:
  - kind: ServiceAccount
    name: aap-vm-inventory
    namespace: aap
roleRef:
  kind: ClusterRole
  name: aap-vm-inventory-reader
  apiGroup: rbac.authorization.k8s.io
