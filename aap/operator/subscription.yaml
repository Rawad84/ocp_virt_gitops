# Requires the cluster's global pull secret to include registry.redhat.io
# credentials tied to a valid AAP subscription/entitlement — the operator
# image itself won't pull without that, regardless of this manifest.
#
# Verify `channel` against what's actually offered in your cluster's
# redhat-operators catalog before applying:
#   oc get packagemanifest ansible-automation-platform-operator \
#     -o jsonpath='{.status.channels[*].name}'
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform-operator
  namespace: aap
spec:
  channel: stable-2.5
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
