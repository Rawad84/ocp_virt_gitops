name: Validate VM Requests

on:
  push:
    branches: ["**"]
    paths:
      # NOTE: these are repo-root-relative. If this project gets copied into
      # a subfolder of a larger monorepo, prefix each entry with that
      # subfolder's path (e.g. "ocp-virt-gitops/requests/**"), and move this
      # workflow file itself into the monorepo's own root .github/workflows/
      # — GitHub only discovers workflows there, never in a subfolder.
      - "requests/**"
      - "ci/validate-request.sh"
      - "argocd/registered-clusters.yaml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "requests/**"
      - "ci/validate-request.sh"
      - "argocd/registered-clusters.yaml"
      - ".github/workflows/validate.yml"

# Least-privilege default: this job only reads the repo, never writes
# anything or calls the GitHub API, so it needs no permissions at all
# beyond checking out code.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to the exact commit for v7.0.0, not the mutable "v4"/"v7" tag
      # - a tag can be repointed at different code later; a commit SHA can't.
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install yq
        env:
          YQ_VERSION: v4.53.3
          # GitHub-computed digest for this exact release asset (independent
          # of the yq project's own release process) - verified below so a
          # tampered or substituted binary fails the build instead of
          # silently running.
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          curl -sSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Run request validation
        run: ./ci/validate-request.sh
