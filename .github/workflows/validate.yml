name: Validate VM Requests

on:
  push:
    branches: ["**"]
    paths:
      # NOTE: these are repo-root-relative. If this project gets copied into
      # a subfolder of a larger monorepo, prefix each entry with that
      # subfolder's path (e.g. "ocp-virt-gitops/requests/**"), and move this
      # workflow file itself into the monorepo's own root .github/workflows/
      # — GitHub only discovers workflows there, never in a subfolder.
      - "requests/**"
      - "ci/validate-request.sh"
      - "argocd/registered-clusters.yaml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "requests/**"
      - "ci/validate-request.sh"
      - "argocd/registered-clusters.yaml"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Run request validation
        run: ./ci/validate-request.sh
