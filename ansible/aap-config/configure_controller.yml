# Configures AAP Controller (Project, Credentials, Job Templates) so the VM
# provisioning workflow has "VM Wait For Ready" and "VM Post-Configuration"
# Job Templates for intake_create_vm_request.yml to launch, and so the
# intake playbook itself has a Job Template it can be launched as (front
# door mechanism is still undecided — this just makes it launchable either
# from the Controller UI/API or a survey, whichever gets picked).
#
# Run this once against your Controller instance (e.g. as a one-off job, or
# via controller_configuration-style GitOps if you adopt that later):
#   ansible-playbook aap-config/configure_controller.yml \
#     -e controller_host=https://<controller-route> \
#     -e controller_username=admin \
#     -e controller_password=<...>
#
# Credentials referenced below (git-push-token, vm-ssh-key,
# openshift-<cluster_name>, controller-api) are created as placeholders
# here — fill in real secret values through the Controller UI/API, not by
# committing them to this file. bluecat-api is deliberately NOT created
# here - see the task below.
---
- name: Configure AAP Controller for the VM intake / post-config pipeline
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    controller_validate_certs: true

  tasks:
    - name: Create the Project pointing at this repo's ansible/ content
      ansible.controller.project:
        name: "VM GitOps Ansible Content"
        organization: "Default"
        scm_type: git
        scm_url: "https://github.com/Rawad84/ocp_virt_gitops.git"
        scm_branch: "{{ vm_requests_branch | default('ocp-test') }}"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    # credential_type must be the custom "Git Push Token" type (see
    # aap/credential-types/create-git-push-token-type.sh), not the built-in
    # "Source Control" type - the built-in type has no injector and never
    # actually exposes the token to a running job. See aap/LESSONS_LEARNED.md
    # "Built-in GitHub Personal Access Token credential type has no injector".
    - name: Create git push credential placeholder
      ansible.controller.credential:
        name: "git-push-token"
        organization: "Default"
        credential_type: "Git Push Token"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create SSH machine credential placeholder for post-config
      ansible.controller.credential:
        name: "vm-ssh-key"
        organization: "Default"
        credential_type: "Machine"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    # bluecat-api is intentionally NOT created here - IPAM stays disabled
    # (use_ipam: false) for now, and creating it prematurely with no real
    # secret values would let it be silently attached to Job Templates
    # before it's actually meant to be used. Create it by hand (see
    # CONTROLLER_SETUP.md "Skipped for now") once use_ipam: true is tested.

    # Backs the per-namespace inventory sources that intake_create_vm_request.yml
    # creates (source: openshift_virtualization), and the openshift-{{ cluster_name }}
    # credential passed at launch time to "VM Wait For Ready"/"VM
    # Post-Configuration" (see tasks/wait_and_configure_vm.yml). Named for
    # cluster_name, not the ArgoCD-reserved `cluster` field - see
    # intake_create_vm_request.yml's header for why. Run this playbook again
    # with -e cluster_name=<new-cluster-name> to onboard another cluster; no
    # code change needed beyond that.
    - name: Create OpenShift/Kubernetes credential placeholder for VM inventory discovery
      ansible.controller.credential:
        name: "openshift-{{ cluster_name | default('cluster-fq2h5') }}"
        organization: "Default"
        credential_type: "OpenShift or Kubernetes API Bearer Token"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    # Lets the intake playbook's own ansible.controller.inventory /
    # ansible.controller.inventory_source tasks authenticate back to this
    # Controller instance (controller_host/controller_username/
    # controller_password) to provision the per-namespace inventory - see
    # intake_create_vm_request.yml.
    - name: Create Controller API credential placeholder
      ansible.controller.credential:
        name: "controller-api"
        organization: "Default"
        credential_type: "Red Hat Ansible Automation Platform"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create the VM Intake Job Template
      ansible.controller.job_template:
        name: "VM Intake"
        organization: "Default"
        project: "VM GitOps Ansible Content"
        playbook: "ansible/playbooks/intake_create_vm_request.yml"
        # Doesn't functionally matter - the playbook targets hosts: localhost
        # / connection: local regardless of what's assigned here. Set anyway
        # since Controller requires every Job Template to have one.
        inventory: "Demo Inventory"
        # Has ansible.controller available - the org/global default EE is
        # not guaranteed to (see aap/LESSONS_LEARNED.md "Execution
        # Environment").
        execution_environment: "Day 2 EE"
        credentials:
          - "git-push-token"
          - "controller-api"
          # add "bluecat-api" once it's created and use_ipam: true is tested
        # No cluster-API credential here - this playbook never talks to the
        # cluster directly, it launches "VM Wait For Ready" and "VM
        # Post-Configuration" (see tasks/wait_and_configure_vm.yml), each of
        # which is given "openshift-{{ cluster_name }}" by name at launch
        # time. Keeps "point this pipeline at a different cluster = create
        # another openshift-<cluster_name> credential, no code change" true
        # end to end.
        # group_name/cluster/namespace/ssh_key/networks/vms differ on every
        # launch and have no defaults in the playbook - without this,
        # Controller silently drops/rejects extra_vars passed at launch
        # (see aap/LESSONS_LEARNED.md "Prompt on launch gotchas").
        ask_variables_on_launch: true
        extra_vars:
          use_ipam: false
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create the VM Post-Configuration Job Template
      ansible.controller.job_template:
        name: "VM Post-Configuration"
        organization: "Default"
        project: "VM GitOps Ansible Content"
        playbook: "ansible/playbooks/postconfig.yml"
        execution_environment: "Day 2 EE"
        credentials:
          - "vm-ssh-key"
        # No cluster-API credential statically attached - the caller passes
        # "openshift-{{ cluster_name }}" by name at launch time (see
        # tasks/wait_and_configure_vm.yml) so this template works unmodified
        # against whatever cluster the request targets. Backs the
        # delegate_to: localhost kubernetes.core tasks (annotation check +
        # patch) - the credential granted patch/update on virtualmachines
        # (see ../../aap/rbac/vm-inventory-serviceaccount.yaml).
        ask_credential_on_launch: true
        # The per-namespace inventory varies per VM request, so it must be
        # left promptable rather than fixed on the template.
        ask_inventory_on_launch: true
        # vm_name/vm_namespace differ on every launch and have no defaults
        # in the playbook - without this, Controller silently drops/rejects
        # extra_vars passed at launch (see aap/LESSONS_LEARNED.md "Prompt on
        # launch gotchas").
        ask_variables_on_launch: true
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"

    - name: Create the VM Wait For Ready Job Template
      ansible.controller.job_template:
        name: "VM Wait For Ready"
        organization: "Default"
        project: "VM GitOps Ansible Content"
        playbook: "ansible/playbooks/wait_for_vm_ready.yml"
        # Doesn't functionally matter - the playbook targets hosts: localhost
        # / connection: local regardless of what's assigned here.
        inventory: "Demo Inventory"
        execution_environment: "Day 2 EE"
        # No cluster-API credential statically attached - same
        # "openshift-{{ cluster_name }}" by-name-at-launch pattern as VM
        # Post-Configuration above.
        ask_credential_on_launch: true
        ask_variables_on_launch: true
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
