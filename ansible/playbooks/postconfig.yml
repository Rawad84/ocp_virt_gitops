# Applies baseline configuration to a VM the provisioning workflow has
# already confirmed is ready (guest agent connected) and registered in the
# per-namespace dynamic inventory - see whatever precedes this step in the
# workflow for how "ready" gets confirmed. Designed to tolerate being
# launched more than once against the same VM (a workflow re-run that only
# adds a new VM to a group should not re-apply post-config to VMs already
# configured in a prior run): the first task checks the parent VM object
# (not the VMI - a VMI is deleted/recreated on stop/start, so it can't carry
# a durable marker) for the vm-gitops.io/post-config-applied annotation and
# skips the rest of the play if it's already set. Requires a cluster-API
# credential (e.g. "openshift-in-cluster") passed by name as `credentials`
# at launch time - not statically attached, since the "VM Post-Configuration"
# Job Template has ask_credential_on_launch: true precisely so this works
# unmodified against whatever cluster the request targets (see
# ../aap-config/configure_controller.yml and tasks/wait_and_configure_vm.yml)
# - so the delegate_to: localhost kubernetes.core tasks below can reach the
# cluster API, and the aap-vm-inventory ClusterRole's patch/update verb on
# virtualmachines (see ../../aap/rbac/vm-inventory-serviceaccount.yaml).
#
# This is intentionally still a minimal stub otherwise — actual post-config
# requirements (packages, users, hardening, whatever) haven't been defined
# yet. Fill in real tasks in the marked block below once they are.
#
# Expected extra_vars: vm_name, vm_namespace
#
# Connectivity to the VM itself comes from the per-namespace dynamic
# inventory (see intake_create_vm_request.yml), already synced via its
# update_on_launch setting. The openshift_virtualization inventory plugin
# names hosts "<namespace>-<vm-name>", not the bare VM name - confirmed
# against the live inventory (e.g. "vm-example-3-test-vm-5") - so `hosts:`
# below must reconstruct that, not use vm_name alone. ansible_user /
# ansible_ssh_private_key_file come from the vm-ssh-key Machine credential
# attached to the "VM Post-Configuration" Job Template.
---
- name: Post-configure a freshly provisioned VM (once-only per VM)
  hosts: "{{ vm_namespace }}-{{ vm_name }}"
  gather_facts: false

  tasks:
    - name: Look up the parent VM's current annotations
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      delegate_to: localhost
      register: vm_lookup

    - name: Determine whether post-config already ran for this VM
      ansible.builtin.set_fact:
        post_config_already_applied: >-
          {{ 'vm-gitops.io/post-config-applied' in
             (vm_lookup.resources[0].metadata.annotations | default({})
              if vm_lookup.resources | default([]) else {}) }}

    - name: Skip - post-config already applied to this VM
      ansible.builtin.meta: end_play
      when: post_config_already_applied

    - name: Gather facts now that we know this run is actually needed
      ansible.builtin.setup:

    # --- real post-config tasks go here ---
    - name: Confirm connectivity (replace with real post-config tasks)
      ansible.builtin.ping:
    # --- end real post-config tasks ---

    - name: Mark this VM as post-config-applied
      kubernetes.core.k8s:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        merge_type: merge
        definition:
          metadata:
            annotations:
              vm-gitops.io/post-config-applied: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      delegate_to: localhost
