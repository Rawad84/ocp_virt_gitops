# Applies baseline configuration to a VM the provisioning workflow has
# already confirmed is ready (guest agent connected) and registered in the
# per-namespace dynamic inventory - see whatever precedes this step in the
# workflow for how "ready" gets confirmed. Designed to tolerate being
# launched more than once against the same VM (a workflow re-run that only
# adds a new VM to a group should not re-apply post-config to VMs already
# configured in a prior run): the first task checks the parent VM object
# (not the VMI - a VMI is deleted/recreated on stop/start, so it can't carry
# a durable marker) for the vm-gitops.io/post-config-applied annotation and
# skips the rest of the play if it's already set. Requires a cluster-API
# credential (e.g. "openshift-in-cluster") passed by name as `credentials`
# at launch time - not statically attached, since the "VM Post-Configuration"
# Job Template has ask_credential_on_launch: true precisely so this works
# unmodified against whatever cluster the request targets (see
# ../aap-config/configure_controller.yml and tasks/wait_and_configure_vm.yml)
# - so the delegate_to: localhost kubernetes.core tasks below can reach the
# cluster API, and the aap-vm-inventory ClusterRole's patch/update verb on
# virtualmachines (see ../../aap/rbac/vm-inventory-serviceaccount.yaml).
#
# This is intentionally still a minimal stub otherwise — actual post-config
# requirements (packages, users, hardening, whatever) haven't been defined
# yet. Fill in real tasks in the marked block below once they are.
#
# Expected extra_vars: vm_name, vm_namespace, vm_ssh_network_name
#
# The per-namespace dynamic inventory (see intake_create_vm_request.yml)
# only supports one network_name for every VM it discovers in that
# namespace - wrong for any VM not on that one chosen VLAN if a namespace
# mixes VMs across several. So this playbook does NOT trust that
# inventory's ansible_host: the first play below looks up this specific
# VM's own interface directly (same technique as wait_for_vm_ready.yml) and
# overrides ansible_host for just this host via add_host before the second
# play connects. The inventory is still what's asked for by
# `hosts: "<namespace>-<vm-name>"` name/existence and for ansible_user /
# ansible_ssh_private_key_file, which come from the vm-ssh-key Machine
# credential attached to the "VM Post-Configuration" Job Template (applied
# job-wide, not per-inventory-host, so an add_host-created override still
# gets them).
---
- name: "Resolve {{ vm_name }}'s actual connection IP for its own network"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Mirrors wait_for_vm_ready.yml's _vm_ssh_interface_name - "default"
    # (pod network) unless a specific network was passed.
    _vm_ssh_interface_name: "{{ vm_ssh_network_name | default('') or 'default' }}"

  tasks:
    - name: "Look up {{ vm_name }}'s VMI to find its {{ _vm_ssh_interface_name }} interface"
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      register: _vmi_lookup

    # Already confirmed reachable by "VM Wait For Ready" before this
    # playbook is ever launched (see tasks/wait_and_configure_vm.yml) - a
    # missing interface here means something changed the VM between then
    # and now, worth a clear failure rather than a cryptic Jinja error.
    - name: "Fail clearly if {{ _vm_ssh_interface_name }} interface/IP isn't there"
      ansible.builtin.fail:
        msg: >-
          VMI {{ vm_namespace }}/{{ vm_name }} has no '{{ _vm_ssh_interface_name }}'
          interface with an IP right now, even though VM Wait For Ready
          already confirmed one - was the VM restarted in between?
      when: >-
        _vmi_lookup.resources | default([]) | length == 0
        or (_vmi_lookup.resources[0].status.interfaces | default([])
            | selectattr('name', 'equalto', _vm_ssh_interface_name)
            | map(attribute='ipAddress', default='') | select('ne', '') | list | length == 0)

    - name: "Override ansible_host for {{ vm_namespace }}-{{ vm_name }} with its real IP"
      ansible.builtin.add_host:
        name: "{{ vm_namespace }}-{{ vm_name }}"
        ansible_host: >-
          {{ (_vmi_lookup.resources[0].status.interfaces
              | selectattr('name', 'equalto', _vm_ssh_interface_name) | map(attribute='ipAddress') | first) }}

- name: Post-configure a freshly provisioned VM (once-only per VM)
  hosts: "{{ vm_namespace }}-{{ vm_name }}"
  gather_facts: false

  tasks:
    - name: Look up the parent VM's current annotations
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      delegate_to: localhost
      register: vm_lookup

    - name: Determine whether post-config already ran for this VM
      ansible.builtin.set_fact:
        post_config_already_applied: >-
          {{ 'vm-gitops.io/post-config-applied' in
             (vm_lookup.resources[0].metadata.annotations | default({})
              if vm_lookup.resources | default([]) else {}) }}

    - name: Skip - post-config already applied to this VM
      ansible.builtin.meta: end_play
      when: post_config_already_applied

    - name: Gather facts now that we know this run is actually needed
      ansible.builtin.setup:

    # --- real post-config tasks go here ---
    - name: Confirm connectivity (replace with real post-config tasks)
      ansible.builtin.ping:

    # Demo-visible proof that post-config actually ran, not just that the
    # annotation got set - a login banner (seen immediately on SSH) plus a
    # marker file (for a clean `cat` during a demo). Replace/extend once
    # real baseline-config tasks (OS patches, hardening, agents, identity,
    # compliance) are defined. become: true because /etc/ needs root - the
    # golden image's default cloud-user has passwordless sudo out of the
    # box (standard for RHEL cloud images), no explicit sudo setup needed
    # in the chart's cloud-init.
    - name: Write a login banner proving post-config ran
      ansible.builtin.blockinfile:
        path: /etc/motd
        create: true
        mode: "0644"
        marker: "# {mark} vm-gitops post-config"
        block: |
          Post-configured by the AAP VM GitOps pipeline
            VM:  {{ vm_name }}
            Applied: {{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
      become: true

    - name: Write a marker file proving post-config ran
      ansible.builtin.copy:
        dest: /etc/vm-gitops-post-config.txt
        mode: "0644"
        content: |
          vm_name={{ vm_name }}
          vm_namespace={{ vm_namespace }}
          applied_at={{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
      become: true
    # --- end real post-config tasks ---

    - name: Mark this VM as post-config-applied
      kubernetes.core.k8s:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        merge_type: merge
        definition:
          metadata:
            annotations:
              vm-gitops.io/post-config-applied: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
      delegate_to: localhost
