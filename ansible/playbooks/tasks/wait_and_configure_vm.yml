# Included once per VM in this run's vms_with_ips loop (see
# intake_create_vm_request.yml) - launches "VM Wait For Ready" for it, then
# "VM Post-Configuration". Both are launched with credentials:
# ["openshift-{{ cluster_name }}"] passed by name at launch time (not a
# statically-attached credential) so this works unmodified against whatever
# cluster the request targets - same "openshift-<cluster_name>" naming/lookup
# convention the inventory_source task above already uses. cluster_name, not
# the ArgoCD-reserved `cluster` field - see intake_create_vm_request.yml's
# header for why.
#
# VM Post-Configuration's launch-time `credentials` list must include
# every credential statically attached to that template too - "vm-ssh-key"
# and "controller-api" - even though both are already statically attached:
# a launch-time `credentials` override has to name the complete desired
# credential set, not just the delta being added, or Controller rejects it
# with "Removing <credential type> credential at launch time without
# replacement is not supported". Confirmed live for both: vm-ssh-key
# (Machine) first, then controller-api (Red Hat Ansible Automation
# Platform) the first time a VM ever actually reached this task instead of
# getting stuck earlier in the pipeline.
#
# The calling loop wraps this with ignore_errors: true so one VM being
# slow/stuck doesn't block post-config from still being applied to the
# other new VMs in the same request.
#
# No explicit controller_host/controller_username/controller_password on
# either job_launch below - same reasoning as the inventory/inventory_source
# tasks above: the "controller-api" Credential injects CONTROLLER_HOST/
# CONTROLLER_USERNAME/CONTROLLER_PASSWORD as environment variables, and
# ansible.controller modules fall back to those automatically when the
# module params are omitted.
---
- name: "Wait for {{ vm_item.name }} to be ready"
  ansible.controller.job_launch:
    job_template: "VM Wait For Ready"
    credentials:
      - "openshift-{{ cluster_name }}"
    extra_vars:
      vm_name: "{{ vm_item.name }}"
      vm_namespace: "{{ namespace }}"
      vm_ready_max_retries: "{{ vm_ready_max_retries }}"
      vm_ready_retry_delay_seconds: "{{ vm_ready_retry_delay_seconds }}"
      vm_ssh_network_name: "{{ vm_ssh_network_name }}"
    wait: true
    validate_certs: "{{ controller_validate_certs }}"

- name: "Launch VM Post-Configuration for {{ vm_item.name }}"
  ansible.controller.job_launch:
    job_template: "VM Post-Configuration"
    inventory: "{{ namespace }}"
    credentials:
      - "vm-ssh-key"
      - "openshift-{{ cluster_name }}"
      - "controller-api"
    extra_vars:
      vm_name: "{{ vm_item.name }}"
      vm_namespace: "{{ namespace }}"
    wait: true
    validate_certs: "{{ controller_validate_certs }}"
