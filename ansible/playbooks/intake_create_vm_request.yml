# Front door of the pipeline: takes a VM request (however it's launched —
# Job Template survey, API call, etc. — that's still undecided, see repo
# discussion), optionally resolves IPs for every VM via IPAM, renders
# requests/<group_name>/request.yaml, and commits+pushes it directly to the
# branch ArgoCD's vm-requests ApplicationSet watches. ArgoCD takes over from
# there — this playbook does not create the VM itself.
#
# Adding a VM to a group that already has one: only pass the new VM (and any
# new network it needs) in extra_vars, not the group's existing VMs/networks
# too — this playbook merges by `name` with whatever's already in that
# group's request.yaml (existing entries are kept, a name collision lets this
# run's version win) rather than overwriting the file outright.
#
# IP assignment mode is controlled by use_ipam:
#   - use_ipam: false (default) — DHCP. No IPAM backend is called; networks/
#     vms are passed through to request.yaml as-is, and the chart's cloud-init
#     brings up the VLAN interface with dhcp4: true instead of a static
#     address. This is the current default while testing.
#   - use_ipam: true — static, via IPAM. Backend is pluggable via
#     ipam_role_name — "netbox" for testing against a NetBox stand-in, or
#     "bluecat" once pointed at the customer's real BlueCat instance. Both
#     roles implement the same task-file/fact contract (see
#     ansible/roles/bluecat/tasks/ensure_network.yml for the contract
#     definition), so switching is just this one var plus swapping which
#     connection credential (netbox_host/netbox_token vs bluecat_host/
#     bluecat_username/bluecat_password/bluecat_configuration) gets injected —
#     nothing else in this playbook changes.
#
# Expected extra_vars:
#   use_ipam: false                  # true once ready to test IPAM
#   ipam_role_name: "netbox"         # or "bluecat" — only matters if use_ipam: true
#   group_name: "group-2"            # becomes requests/<group_name>/
#   cluster: "in-cluster"
#   namespace: "vm-example-2"
#   ssh_key: "ssh-ed25519 AAAA..."
#   networks:
#     - { name: vlan-1414, vlanID: 1414 }   # prefixLength/gateway come from IPAM when use_ipam: true
#   vms:
#     - { name: my-vm-1, size: small, network: vlan-1414 }
#
# Requires (inject via AAP credentials, not extra_vars in plaintext):
#   netbox_host, netbox_token                                    (netbox backend, use_ipam: true only)
#   bluecat_host, bluecat_username, bluecat_password, bluecat_configuration  (bluecat backend, use_ipam: true only)
#   git_push_token — PAT with push access to this repo
#   controller_host, controller_username, controller_password — this Controller instance's own API
#
# Also requires a Credential named "openshift-<cluster>" (e.g.
# "openshift-in-cluster") to already exist in Controller for whatever
# `cluster` value is passed in — same "provision first, this pipeline
# doesn't auto-create it" contract as the NetBox/BlueCat VLANs above. That
# credential is what lets the per-namespace inventory source (created below)
# actually reach the target cluster's API, and is what makes pointing this
# pipeline at a cluster AAP doesn't run on just "add another Credential",
# not a code change.
---
- name: Create VM request file via IPAM allocation and push to git
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # DHCP by default - no IPAM backend is called, and VMs get their VLAN IP
    # from a DHCP server on that VLAN rather than a static allocation.
    # Flip to true (and set ipam_role_name) once BlueCat/NetBox is ready to
    # test - the tasks below are unchanged, just gated on this.
    use_ipam: false
    ipam_role_name: "netbox"
    vm_requests_repo_url: "https://github.com/Rawad84/ocp_virt_gitops.git"
    vm_requests_branch: "ocp-test"
    vm_requests_checkout_dir: "/tmp/vm-requests-intake/{{ group_name }}"
    controller_validate_certs: true

  tasks:
    # include_tasks (dynamic) evaluates its own `when` exactly once, before
    # the included tasks - and their loops - are even loaded into the play.
    # That's what actually gates this cleanly: a block or import_tasks
    # (static) would instead AND `when: use_ipam` onto each contained task
    # individually, which - combined with `loop` - is evaluated per item, not
    # once for the whole task. That produced a skip-artifact per loop item
    # instead of a clean skip, and the next task failed templating a label
    # field those artifacts don't have. See tasks/ipam_resolve_and_allocate.yml.
    - name: Resolve networks and allocate IPs via IPAM
      ansible.builtin.include_tasks: tasks/ipam_resolve_and_allocate.yml
      when: use_ipam

    # DHCP path: no subnet details to resolve, no IP to allocate - pass
    # networks/vms straight through as-is. The chart renders dhcp4: true for
    # any VM without an 'ip' key.
    - name: Build resolved networks list for DHCP
      ansible.builtin.set_fact:
        resolved_networks: "{{ networks }}"
      when: not use_ipam

    - name: Build VMs list for DHCP
      ansible.builtin.set_fact:
        vms_with_ips: "{{ vms }}"
      when: not use_ipam

    - name: Clone the GitOps repo
      ansible.builtin.git:
        repo: "{{ vm_requests_repo_url }}"
        dest: "{{ vm_requests_checkout_dir }}"
        version: "{{ vm_requests_branch }}"
        force: true

    # ansible.builtin.template does not create missing destination
    # directories - requests/<group_name>/ won't exist yet for a new group.
    - name: Ensure the requests/{{ group_name }} directory exists
      ansible.builtin.file:
        path: "{{ vm_requests_checkout_dir }}/requests/{{ group_name }}"
        state: directory
        mode: "0755"

    - name: Check for an existing request.yaml for this group
      ansible.builtin.stat:
        path: "{{ vm_requests_checkout_dir }}/requests/{{ group_name }}/request.yaml"
      register: _existing_request_file

    # Callers only ever submit what's new/changed for this launch - not the
    # group's full history - so an existing request.yaml (adding a VM to a
    # group that already has one) must be merged with, not replaced. Render
    # (below) would otherwise overwrite the file with only this run's
    # networks/vms and silently drop every previously-added VM, which ArgoCD
    # would then read as "delete that VM" on its next sync.
    - name: Load existing request.yaml for this group, if any
      ansible.builtin.set_fact:
        _existing_request: "{{ (lookup('file', vm_requests_checkout_dir + '/requests/' + group_name + '/request.yaml') | from_yaml) if _existing_request_file.stat.exists else {'networks': [], 'vms': []} }}"

    # Merge by `name`: this run's entries win on a name collision (so
    # re-submitting a network/VM updates it in place), anything from the
    # existing file whose name isn't in this run's list is carried over
    # untouched.
    - name: Merge this run's networks with the group's existing networks
      ansible.builtin.set_fact:
        merged_networks: "{{ _existing_request.networks | default([]) | rejectattr('name', 'in', resolved_networks | map(attribute='name') | list) | list + resolved_networks }}"

    - name: Merge this run's VMs with the group's existing VMs
      ansible.builtin.set_fact:
        merged_vms: "{{ _existing_request.vms | default([]) | rejectattr('name', 'in', vms_with_ips | map(attribute='name') | list) | list + vms_with_ips }}"

    # render_networks/render_vms (not networks/vms) - extra_vars (this Job
    # Template's own networks/vms inputs) outrank task vars in Ansible's
    # precedence order, so a task-level `vars: {networks: ..., vms: ...}`
    # override under those same names is silently ignored and the template
    # ends up rendering the raw incoming networks/vms instead of the merged
    # result. Distinct names sidestep the collision entirely.
    - name: Render request.yaml
      ansible.builtin.template:
        src: templates/request.yaml.j2
        dest: "{{ vm_requests_checkout_dir }}/requests/{{ group_name }}/request.yaml"
      vars:
        render_networks: "{{ merged_networks }}"
        render_vms: "{{ merged_vms }}"

    - name: Commit and push directly to {{ vm_requests_branch }}
      ansible.builtin.shell: |
        set -euo pipefail
        git config user.email "aap-intake@example.internal"
        git config user.name "AAP VM Intake"
        git add "requests/{{ group_name }}/request.yaml"
        git commit -m "Update VM request: {{ group_name }}"
        git push "https://x-access-token:{{ git_push_token }}@github.com/Rawad84/ocp_virt_gitops.git" "HEAD:{{ vm_requests_branch }}"
      args:
        chdir: "{{ vm_requests_checkout_dir }}"
      no_log: true

    # Named after `namespace`, not `group_name` — the two are allowed to
    # differ (see the extra_vars example above), and EDA's vm-ready rule only
    # ever has `namespace` available off the VirtualMachineInstance event, so
    # namespace is the only key both this playbook and EDA can agree on.
    # Created now even though no VM exists yet - cheap, and it lets the
    # inventory source's own `update_on_launch` handle population later
    # instead of this playbook needing to orchestrate a sync.
    # No explicit controller_host/controller_username/controller_password
    # here - the "controller-api" Credential (Red Hat Ansible Automation
    # Platform type) attached to this Job Template injects
    # CONTROLLER_HOST/CONTROLLER_USERNAME/CONTROLLER_PASSWORD as environment
    # variables, and ansible.controller modules fall back to those
    # automatically when the module params are omitted. Passing
    # "{{ controller_host }}" etc. here would reference undefined Jinja
    # vars, not the injected env vars - this is the actual, working pattern.
    - name: Ensure an AAP Inventory exists for this namespace
      ansible.controller.inventory:
        name: "{{ namespace }}"
        organization: "Default"
        state: present
        validate_certs: "{{ controller_validate_certs }}"

    # source: openshift_virtualization is AAP 2.5's built-in dynamic
    # inventory plugin for KubeVirt VMs (backed by the kubevirt.core
    # collection) - confirmed against a live AAP 2.5 instance, including the
    # source_vars.namespaces schema and that update_on_launch/credential wire
    # up the same way whether done via this module or by hand in the UI.
    #
    # execution_environment must have kubevirt.core/kubernetes.core
    # installed for the source plugin to actually run - the org/global
    # default EE won't necessarily have it. "Day 2 EE" is this environment's
    # pre-built EE for OpenShift Virtualization ops; substitute whatever
    # equivalent EE exists elsewhere.
    #
    # update_on_launch means Controller re-syncs this source immediately
    # before any Job Template launch that uses this inventory, so a
    # newly-created VM is discovered automatically at post-config time with
    # no separate sync step required from the EDA rulebook.
    - name: Ensure a dynamic inventory source discovers this namespace's VMs
      ansible.controller.inventory_source:
        name: "{{ namespace }}-openshift-virtualization"
        inventory: "{{ namespace }}"
        organization: "Default"
        source: "openshift_virtualization"
        credential: "openshift-{{ cluster }}"
        execution_environment: "Day 2 EE"
        update_on_launch: true
        source_vars:
          namespaces:
            - "{{ namespace }}"
        state: present
        validate_certs: "{{ controller_validate_certs }}"
