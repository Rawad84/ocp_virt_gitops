# Front door of the pipeline, and the full provisioning workflow end to end:
# takes a VM request (however it's launched — Job Template survey, API call,
# etc. — that's still undecided, see repo discussion), optionally resolves
# IPs for every VM via IPAM, renders requests/<group_name>/request.yaml, and
# commits+pushes it directly to the branch ArgoCD's vm-requests
# ApplicationSet watches — ArgoCD creates the actual VM from there, this
# playbook does not create it directly. Then, for each NEW VM in this run
# only (never the group's pre-existing VMs — see the vms_with_ips vs.
# merged_vms note near the bottom): waits for its guest agent to connect,
# registers/refreshes it in the per-namespace AAP inventory, and launches
# "VM Post-Configuration" for it. A rerun that only adds one more VM to an
# already-provisioned group does not re-wait-for or re-configure the VMs
# already there from a prior run.
#
# Adding a VM to a group that already has one: only pass the new VM (and any
# new network it needs) in extra_vars, not the group's existing VMs/networks
# too — this playbook merges by `name` with whatever's already in that
# group's request.yaml (existing entries are kept, a name collision lets this
# run's version win) rather than overwriting the file outright.
#
# IP assignment mode is controlled by use_ipam:
#   - use_ipam: false (default) — DHCP. No IPAM backend is called; networks/
#     vms are passed through to request.yaml as-is, and the chart's cloud-init
#     brings up the VLAN interface with dhcp4: true instead of a static
#     address. This is the current default while testing.
#   - use_ipam: true — static, via IPAM. Backend is pluggable via
#     ipam_role_name — "netbox" for testing against a NetBox stand-in, or
#     "bluecat" once pointed at the customer's real BlueCat instance. Both
#     roles implement the same task-file/fact contract (see
#     ansible/roles/bluecat/tasks/ensure_network.yml for the contract
#     definition), so switching is just this one var plus swapping which
#     connection credential (netbox_host/netbox_token vs bluecat_host/
#     bluecat_username/bluecat_password/bluecat_configuration) gets injected —
#     nothing else in this playbook changes.
#
# Expected extra_vars:
#   use_ipam: false                  # true once ready to test IPAM
#   ipam_role_name: "netbox"         # or "bluecat" — only matters if use_ipam: true
#   group_name: "group-2"            # becomes requests/<group_name>/
#   cluster_name: "cluster-fq2h5"    # clear cluster identifier - the ONLY cluster input a caller supplies
#   namespace: "vm-example-2"
#   ssh_key: "ssh-ed25519 AAAA..."
#   networks:
#     - { name: vlan-1414, vlanID: 1414 }   # prefixLength/gateway come from IPAM when use_ipam: true
#   vms:
#     - { name: my-vm-1, size: small, network: vlan-1414 }
#
# Requires (inject via AAP credentials, not extra_vars in plaintext):
#   netbox_host, netbox_token                                    (netbox backend, use_ipam: true only)
#   bluecat_host, bluecat_username, bluecat_password, bluecat_configuration  (bluecat backend, use_ipam: true only)
#   git_push_token — PAT with read+push access to this repo (used to
#     authenticate both the initial clone and the final push - a private
#     repo will hang on "Clone the GitOps repo" without it)
#   controller_host, controller_username, controller_password — this Controller instance's own API
#
# `cluster` vs `cluster_name`: a caller never supplies `cluster` directly -
# this playbook resolves it automatically from `cluster_name` via
# argocd/registered-clusters.yaml (cloned locally along with everything
# else, see below), failing outright if `cluster_name` isn't listed there.
# `cluster` is Argo CD's own destination identifier (the ApplicationSet
# passes it straight through as destination.name) - "in-cluster" is Argo
# CD's reserved name for the cluster it runs on itself, not a human-chosen
# name, which is exactly why a caller shouldn't have to know or type it.
# `cluster_name` has no Argo CD meaning at all; it's used everywhere a
# clear cluster identifier is needed for naming Controller objects
# (inventory, credentials) and the chart's per-cluster bridges: map. Both
# fields still end up written into the committed request.yaml - Argo CD's
# Git file generator reads `cluster` as a raw key straight off that file,
# so it has to be there even though nobody types it by hand.
#
# Also requires a Credential named "openshift-<cluster_name>" (e.g.
# "openshift-cluster-fq2h5") to already exist in Controller for whatever
# `cluster_name` value is passed in — same "provision first, this pipeline
# doesn't auto-create it" contract as the NetBox/BlueCat VLANs above. Used in
# two places, both by name, never statically attached to a Job Template (so
# a different `cluster_name` value can't accidentally use the wrong
# cluster's credential): the per-namespace inventory source below, and
# passed as `credentials: ["openshift-{{ cluster_name }}"]` at launch time
# to "VM Wait For Ready" and "VM Post-Configuration" (see
# tasks/wait_and_configure_vm.yml). This is what makes pointing this
# pipeline at a cluster AAP doesn't run on just "add another Credential",
# not a code change.
---
- name: Create VM request file via IPAM allocation and push to git
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # DHCP by default - no IPAM backend is called, and VMs get their VLAN IP
    # from a DHCP server on that VLAN rather than a static allocation.
    # Flip to true (and set ipam_role_name) once BlueCat/NetBox is ready to
    # test - the tasks below are unchanged, just gated on this.
    use_ipam: false
    ipam_role_name: "netbox"
    vm_requests_repo_url: "https://github.com/Rawad84/ocp_virt_gitops.git"
    vm_requests_branch: "feature/aap-bluecat"
    # Where `git clone` actually checks out to - always the true repo root.
    vm_requests_git_root: "/tmp/vm-requests-intake/{{ group_name }}"
    # Set this when this codebase (ansible/, argocd/, charts/, aap/) lives
    # inside a subfolder of the target repo rather than at its root - e.g.
    # a customer repo that holds other unrelated content alongside it. Leave
    # "" when this codebase IS the repo root (this fork's own layout).
    # No leading/trailing slash - e.g. "gitops-code", not "/gitops-code/".
    vm_requests_repo_subdir: ""
    # Every other task below reads/writes argocd/ and requests/ through
    # this - only the clone/push tasks need vm_requests_git_root directly,
    # since they operate on the repo as a whole rather than its content.
    vm_requests_checkout_dir: "{{ vm_requests_git_root }}{{ '/' + vm_requests_repo_subdir if vm_requests_repo_subdir else '' }}"
    controller_validate_certs: true
    # Must already exist in Controller with kubevirt.core/kubernetes.core
    # installed - "Day 2 EE" is this workshop's own build (see
    # aap/LESSONS_LEARNED.md); substitute whatever equivalent EE exists on
    # the target Controller instance.
    vm_intake_execution_environment: "Day 2 EE"

  tasks:
    # include_tasks (dynamic) evaluates its own `when` exactly once, before
    # the included tasks - and their loops - are even loaded into the play.
    # That's what actually gates this cleanly: a block or import_tasks
    # (static) would instead AND `when: use_ipam` onto each contained task
    # individually, which - combined with `loop` - is evaluated per item, not
    # once for the whole task. That produced a skip-artifact per loop item
    # instead of a clean skip, and the next task failed templating a label
    # field those artifacts don't have. See tasks/ipam_resolve_and_allocate.yml.
    - name: Resolve networks and allocate IPs via IPAM
      ansible.builtin.include_tasks: tasks/ipam_resolve_and_allocate.yml
      when: use_ipam

    # DHCP path: no subnet details to resolve, no IP to allocate - pass
    # networks/vms straight through as-is. The chart renders dhcp4: true for
    # any VM without an 'ip' key.
    - name: Build resolved networks list for DHCP
      ansible.builtin.set_fact:
        resolved_networks: "{{ networks }}"
      when: not use_ipam

    - name: Build VMs list for DHCP
      ansible.builtin.set_fact:
        vms_with_ips: "{{ vms }}"
      when: not use_ipam

    - name: Clone the GitOps repo
      ansible.builtin.git:
        repo: "{{ vm_requests_repo_url | regex_replace('^https://', 'https://x-access-token:' + git_push_token + '@') }}"
        dest: "{{ vm_requests_git_root }}"
        version: "{{ vm_requests_branch }}"
        force: true
      #no_log: true

    # A caller only ever supplies cluster_name (see header comment) - this
    # is what resolves it to Argo CD's own destination name, reading the
    # map straight out of this same checkout rather than requiring a
    # separate lookup mechanism.
    - name: Load the cluster_name -> Argo CD destination map
      ansible.builtin.set_fact:
        _registered_clusters: "{{ (lookup('file', vm_requests_checkout_dir + '/argocd/registered-clusters.yaml') | from_yaml).clusters }}"

    - name: Fail if cluster_name isn't a registered cluster
      ansible.builtin.fail:
        msg: >-
          cluster_name '{{ cluster_name }}' has no entry in
          argocd/registered-clusters.yaml - add one there (and a matching
          bridges: entry in charts/vm-request/values.yaml, and an
          openshift-{{ cluster_name }} Credential in Controller) before
          submitting a request for it. See README.md "Onboarding a new
          cluster".
      when: cluster_name not in _registered_clusters

    - name: Resolve cluster (Argo CD destination.name) from cluster_name
      ansible.builtin.set_fact:
        cluster: "{{ _registered_clusters[cluster_name] }}"

    # ansible.builtin.template does not create missing destination
    # directories - requests/<group_name>/ won't exist yet for a new group.
    - name: Ensure the requests/{{ group_name }} directory exists
      ansible.builtin.file:
        path: "{{ vm_requests_checkout_dir }}/requests/{{ group_name }}"
        state: directory
        mode: "0755"

    - name: Check for an existing request.yaml for this group
      ansible.builtin.stat:
        path: "{{ vm_requests_checkout_dir }}/requests/{{ group_name }}/request.yaml"
      register: _existing_request_file

    # Callers only ever submit what's new/changed for this launch - not the
    # group's full history - so an existing request.yaml (adding a VM to a
    # group that already has one) must be merged with, not replaced. Render
    # (below) would otherwise overwrite the file with only this run's
    # networks/vms and silently drop every previously-added VM, which ArgoCD
    # would then read as "delete that VM" on its next sync.
    - name: Load existing request.yaml for this group, if any
      ansible.builtin.set_fact:
        _existing_request: "{{ (lookup('file', vm_requests_checkout_dir + '/requests/' + group_name + '/request.yaml') | from_yaml) if _existing_request_file.stat.exists else {'networks': [], 'vms': []} }}"

    # Merge by `name`: this run's entries win on a name collision (so
    # re-submitting a network/VM updates it in place), anything from the
    # existing file whose name isn't in this run's list is carried over
    # untouched.
    - name: Merge this run's networks with the group's existing networks
      ansible.builtin.set_fact:
        merged_networks: "{{ _existing_request.networks | default([]) | rejectattr('name', 'in', resolved_networks | map(attribute='name') | list) | list + resolved_networks }}"

    - name: Merge this run's VMs with the group's existing VMs
      ansible.builtin.set_fact:
        merged_vms: "{{ _existing_request.vms | default([]) | rejectattr('name', 'in', vms_with_ips | map(attribute='name') | list) | list + vms_with_ips }}"

    # render_networks/render_vms (not networks/vms) - extra_vars (this Job
    # Template's own networks/vms inputs) outrank task vars in Ansible's
    # precedence order, so a task-level `vars: {networks: ..., vms: ...}`
    # override under those same names is silently ignored and the template
    # ends up rendering the raw incoming networks/vms instead of the merged
    # result. Distinct names sidestep the collision entirely.
    - name: Render request.yaml
      ansible.builtin.template:
        src: templates/request.yaml.j2
        dest: "{{ vm_requests_checkout_dir }}/requests/{{ group_name }}/request.yaml"
      vars:
        render_networks: "{{ merged_networks }}"
        render_vms: "{{ merged_vms }}"

    - name: Commit and push directly to {{ vm_requests_branch }}
      ansible.builtin.shell: |
        set -euo pipefail
        git config user.email "aap-intake@example.internal"
        git config user.name "AAP VM Intake"
        git add "{{ (vm_requests_repo_subdir + '/') if vm_requests_repo_subdir else '' }}requests/{{ group_name }}/request.yaml"
        if git diff --cached --quiet; then
          echo "request.yaml already matches what's committed - nothing to push, likely a rerun after a downstream step failed"
        else
          git commit -m "Update VM request: {{ group_name }}"
          git push "{{ vm_requests_repo_url | regex_replace('^https://', 'https://x-access-token:' + git_push_token + '@') }}" "HEAD:{{ vm_requests_branch }}"
        fi
      args:
        chdir: "{{ vm_requests_git_root }}"
      no_log: true

    # Named "<cluster_name>-<namespace>", not just namespace - namespace
    # alone isn't unique once this pipeline targets more than one cluster
    # (two clusters could both have a "vm-example-3" namespace), and a flat
    # namespace-only name would silently collide/overwrite the wrong
    # cluster's inventory. cluster_name (not the ArgoCD-reserved `cluster`
    # field) is what keeps this legible - see the header comment above.
    # Created now even though no VM exists yet - cheap, and it lets the
    # inventory source's own `update_on_launch` handle population later
    # instead of this playbook needing to orchestrate a sync.
    # No explicit controller_host/controller_username/controller_password
    # here - the "controller-api" Credential (Red Hat Ansible Automation
    # Platform type) attached to this Job Template injects
    # CONTROLLER_HOST/CONTROLLER_USERNAME/CONTROLLER_PASSWORD as environment
    # variables, and ansible.controller modules fall back to those
    # automatically when the module params are omitted. Passing
    # "{{ controller_host }}" etc. here would reference undefined Jinja
    # vars, not the injected env vars - this is the actual, working pattern.
    - name: Ensure an AAP Inventory exists for this cluster/namespace
      ansible.controller.inventory:
        name: "{{ cluster_name }}-{{ namespace }}"
        organization: "Default"
        state: present
        validate_certs: "{{ controller_validate_certs }}"

    # source: openshift_virtualization is AAP 2.5's built-in dynamic
    # inventory plugin for KubeVirt VMs (backed by the kubevirt.core
    # collection) - confirmed against a live AAP 2.5 instance, including the
    # source_vars.namespaces schema and that update_on_launch/credential wire
    # up the same way whether done via this module or by hand in the UI.
    #
    # execution_environment must have kubevirt.core/kubernetes.core
    # installed for the source plugin to actually run - the org/global
    # default EE won't necessarily have it. "Day 2 EE" is this environment's
    # pre-built EE for OpenShift Virtualization ops; substitute whatever
    # equivalent EE exists elsewhere.
    #
    # update_on_launch means Controller re-syncs this source immediately
    # before any Job Template launch that uses this inventory - it only
    # fires on an actual launch against this inventory, not on a timer or at
    # creation time, so a newly-created VM won't show up here until
    # something downstream in the workflow actually launches against it
    # (confirmed live: this inventory sat empty until manually synced,
    # because nothing had launched against it yet).
    - name: Ensure a dynamic inventory source discovers this namespace's VMs
      ansible.controller.inventory_source:
        name: "{{ cluster_name }}-{{ namespace }}-openshift-virtualization"
        inventory: "{{ cluster_name }}-{{ namespace }}"
        organization: "Default"
        source: "openshift_virtualization"
        credential: "openshift-{{ cluster_name }}"
        execution_environment: "{{ vm_intake_execution_environment }}"
        update_on_launch: true
        # Controller's default (false) makes syncs additive-only - a VM
        # deleted from the cluster (e.g. by editing request.yaml and letting
        # ArgoCD prune it) stays in the inventory forever, since a sync only
        # adds/updates hosts it currently finds and never removes ones that
        # disappeared. Confirmed live: deleted test VMs kept showing up
        # alongside a genuinely new one. overwrite: true makes each sync a
        # true mirror of what's actually in the namespace.
        overwrite: true
        source_vars:
          namespaces:
            - "{{ namespace }}"
        state: present
        validate_certs: "{{ controller_validate_certs }}"

    # Only vms_with_ips (this run's NEW VMs), never merged_vms (the group's
    # full VM list including ones from prior runs) - a rerun that only adds
    # a VM to an existing group must not re-wait/re-configure VMs already
    # provisioned in a prior run, and must not touch them at all. This is
    # the primary guarantee; postconfig.yml's own once-only annotation check
    # is a second, independent safety net in case this scoping is ever
    # bypassed (e.g. a manual re-launch with the wrong vm list).
    - name: Wait for readiness and apply baseline config to this run's new VMs
      ansible.builtin.include_tasks: tasks/wait_and_configure_vm.yml
      loop: "{{ vms_with_ips }}"
      loop_control:
        loop_var: vm_item
        label: "{{ vm_item.name }}"
      vars:
        vm_ready_max_retries: 60
        vm_ready_retry_delay_seconds: 10
      ignore_errors: true
      register: _vm_provisioning_results

    - name: Fail if any VM's readiness-wait or post-config failed
      ansible.builtin.fail:
        msg: >-
          Post-provisioning failed for one or more VMs in this request:
          {{ _vm_provisioning_results.results
             | selectattr('failed', 'defined') | selectattr('failed')
             | map(attribute='vm_item') | map(attribute='name') | list }}
      when: >-
        _vm_provisioning_results.results
        | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
