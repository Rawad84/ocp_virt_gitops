# Example request file — proves the pipeline end to end.
# All PLACEHOLDER values below use RFC 5737 TEST-NET-1 (192.0.2.0/24)
# addressing and reserved/dummy names precisely so they can't collide with a
# real network by accident. Replace before relying on this for a real VM.

cluster: in-cluster   # PLACEHOLDER — must match argocd/registered-clusters.yaml
namespace: vm-example
network:
  name: example-net
  bridge: br1           # PLACEHOLDER — real NNCP bridge interface name
  vlan: 100             # PLACEHOLDER — omit this line entirely for untagged
  prefixLength: 24
  gateway: 192.0.2.1    # PLACEHOLDER
sshKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKwYvPJvp9840BFajmIk4+ZNDGKN0XpmYoO+ix56xmyg test-key-ocp-virt-gitops-example"
vms:
  - name: example-vm-1
    size: small
    ip: 192.0.2.10
  - name: example-vm-2
    ip: 192.0.2.11
    # size omitted -> falls back to defaultSize (small)
