# Example request file — proves the pipeline end to end, including a group
# with two VMs on two DIFFERENT VLANs (same cluster/namespace). Networks
# render as cnv-bridge secondary networks attached to the cluster's Linux
# bridge (see charts/vm-request/values.yaml's `bridge` default) — the
# bridge itself is provisioned out-of-band via a NodeNetworkConfigurationPolicy
# (nmstate); this repo does not manage that. VLANs 1412/1413 here are a TEST
# scenario proving the pipeline mechanically — they still need the bridge's
# uplink to actually trunk these VLANs for real traffic to route.

cluster: in-cluster
namespace: vm-example
networks:
  - name: vlan-1412
    vlanID: 1412
    prefixLength: 24
    gateway: 192.168.100.1   # pretend gateway for the VLAN 1412 test range — may not respond
  - name: vlan-1413
    vlanID: 1413
    prefixLength: 24
    gateway: 192.168.200.1   # pretend gateway for the VLAN 1413 test range — may not respond
sshKey: "ssh-rsa  rsabbar@redhat.com"
vms:
  - name: example-vm-1
    size: small
    ip: 192.168.100.10
    network: vlan-1412
  - name: example-vm-2
    ip: 192.168.200.11
    network: vlan-1413
    # size omitted -> falls back to defaultSize (small)
