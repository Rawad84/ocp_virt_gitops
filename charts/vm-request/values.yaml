# Chart-level defaults only. Request-specific values (cluster, namespace,
# network, vms, sshKey) are supplied per-Application by the ApplicationSet,
# which passes the request file itself as this chart's values — see
# argocd/applicationset-vm-requests.yaml.

defaultSize: small

# Linux bridge every VLAN NAD attaches to (see templates/networkattachmentdefinition.yaml),
# keyed by cluster_name (the request file's own clear cluster identifier -
# see ansible/playbooks/intake_create_vm_request.yml header for why this
# isn't keyed by `cluster`) because a different cluster can have a
# differently-named bridge. Provisioned out-of-band via a
# NodeNetworkConfigurationPolicy (nmstate) on every node of that cluster —
# this repo does not manage that policy, same as it never managed node-level
# VLAN-to-uplink mapping. Confirmed via `oc get nncp` against this cluster.
# A request whose cluster_name has no entry here fails loudly at render time
# (see networkattachmentdefinition.yaml) rather than silently reusing
# another cluster's bridge name. Add one entry per cluster as each is
# onboarded.
bridges:
  cluster-fq2h5: br-flat

# CPU/memory injected directly into each VM's spec.domain — no dependency
# on cluster-provided VirtualMachineClusterInstancetype/Preference objects.
sizeTiers:
  small:
    cpuCores: 1
    memory: 2Gi
  medium:
    cpuCores: 2
    memory: 4Gi
  large:
    cpuCores: 4
    memory: 8Gi

image:
  # Clones from the cluster's existing golden-image DataSource (shipped by
  # OpenShift Virtualization / SSP operator) instead of pulling from an
  # external registry — no egress dependency, and stays current automatically
  # since the DataSource's own DataImportCron keeps it up to date.
  dataSourceName: rhel9
  dataSourceNamespace: openshift-virtualization-os-images

storage:
  # Must be >= the backing PVC size of the DataSource above (rhel9 is 30Gi
  # on this cluster).
  size: 30Gi
  className: ""
