# Chart-level defaults only. Request-specific values (cluster, namespace,
# network, vms, sshKey) are supplied per-Application by the ApplicationSet,
# which passes the request file itself as this chart's values — see
# argocd/applicationset-vm-requests.yaml.

defaultSize: small

# There used to be a `bridges:` map here (one physicalNetworkName string per
# cluster_name) that networkattachmentdefinition.yaml looked up at render
# time. Removed: physicalNetworkName is now always the network's own `name`
# (see that template's comment) - every onboarded cluster's OVN
# bridge-mapping must be provisioned one-per-VLAN, named identically to the
# VLAN's NAD name, so there's nothing left to configure here per cluster.
# cluster-fq2h5 (this repo's own workshop cluster) does NOT yet meet that
# contract - see aap/LESSONS_LEARNED.md before testing against it.

# CPU/memory injected directly into each VM's spec.domain — no dependency
# on cluster-provided VirtualMachineClusterInstancetype/Preference objects.
sizeTiers:
  small:
    cpuCores: 1
    memory: 2Gi
  medium:
    cpuCores: 2
    memory: 4Gi
  large:
    cpuCores: 4
    memory: 8Gi

image:
  # Clones from the cluster's existing golden-image DataSource (shipped by
  # OpenShift Virtualization / SSP operator) instead of pulling from an
  # external registry — no egress dependency, and stays current automatically
  # since the DataSource's own DataImportCron keeps it up to date.
  dataSourceName: rhel9
  dataSourceNamespace: openshift-virtualization-os-images

storage:
  # Must be >= the backing PVC size of the DataSource above (rhel9 is 30Gi
  # on this cluster).
  size: 30Gi
  className: ""
