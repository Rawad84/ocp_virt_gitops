{{- $root := . }}
{{- range .Values.vms }}
{{- $size := .size | default $root.Values.defaultSize }}
{{- $tier := index $root.Values.sizeTiers $size }}
{{- $netName := .network }}
{{- if not $netName }}
  {{- if eq (len $root.Values.networks) 1 }}
    {{- $netName = (first $root.Values.networks).name }}
  {{- else }}
    {{- fail (printf "vm %s: 'network' is required when networks[] has more than one entry" .name) }}
  {{- end }}
{{- end }}
{{- $net := dict }}
{{- range $root.Values.networks }}
  {{- if eq .name $netName }}
    {{- $net = . }}
  {{- end }}
{{- end }}
{{- if not $net.name }}
  {{- fail (printf "vm %s: network '%s' does not match any networks[].name" .name $netName) }}
{{- end }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ required "vm.name is required" .name }}
  namespace: {{ required "namespace is required" $root.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  running: true
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: {{ .name }}
    spec:
      domain:
        cpu:
          cores: {{ $tier.cpuCores }}
        resources:
          requests:
            memory: {{ $tier.memory }}
        devices:
          interfaces:
            - name: {{ $net.name }}
              bridge: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
      networks:
        - name: {{ $net.name }}
          multus:
            networkName: {{ $net.name }}
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ .name }}-boot
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: {{ .name }}
              ssh_authorized_keys:
                - {{ required "sshKey is required" $root.Values.sshKey }}
            networkData: |
              network:
                version: 2
                ethernets:
                  eth0:
                    addresses:
                      - {{ required "vm.ip is required" .ip }}/{{ $net.prefixLength | default 24 }}
                    {{- if $net.gateway }}
                    gateway4: {{ $net.gateway }}
                    {{- end }}
{{- end }}
