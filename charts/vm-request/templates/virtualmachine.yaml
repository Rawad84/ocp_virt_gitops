{{- $root := . }}
{{- range .Values.vms }}
{{- $size := .size | default $root.Values.defaultSize }}
{{- $tier := index $root.Values.sizeTiers $size }}
{{- $skipSecondNic := .skip_second_nic | default false }}
{{- $net := dict }}
{{- if not $skipSecondNic }}
{{- $netName := .network }}
{{- if not $netName }}
  {{- if eq (len $root.Values.networks) 1 }}
    {{- $netName = (first $root.Values.networks).name }}
  {{- else }}
    {{- fail (printf "vm %s: 'network' is required when networks[] has more than one entry" .name) }}
  {{- end }}
{{- end }}
{{- range $root.Values.networks }}
  {{- if eq .name $netName }}
    {{- $net = . }}
  {{- end }}
{{- end }}
{{- if not $net.name }}
  {{- fail (printf "vm %s: network '%s' does not match any networks[].name" .name $netName) }}
{{- end }}
{{- end }}
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ required "vm.name is required" .name }}
  namespace: {{ required "namespace is required" $root.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  running: true
  template:
    metadata:
      labels:
        vm.kubevirt.io/name: {{ .name }}
    spec:
      domain:
        cpu:
          cores: {{ $tier.cpuCores }}
        resources:
          requests:
            memory: {{ $tier.memory }}
        devices:
          interfaces:
            # eth0: pod network (masquerade) - always reachable regardless of
            # whether the VLAN below actually routes anywhere yet. AAP
            # inventory/post-config targets this IP. ports: is required -
            # masquerade only forwards VM-initiated traffic out by default;
            # without it, nothing (including AAP) can open an inbound SSH
            # connection to the VM through the pod IP.
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
            # eth1: customer VLAN (bridge). Static IP when the request
            # carries one (IPAM path), DHCP otherwise (see networkData below).
            # TEMPORARY: skip_second_nic (per-vm, undocumented) skips this
            # interface entirely - added for a one-off live test of a
            # cluster missing the vlan-1415 OVN bridge mapping, to be
            # reverted once that test is done. Not a supported request field.
            {{- if not $skipSecondNic }}
            - name: {{ $net.name }}
              bridge: {}
            {{- end }}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
      networks:
        - name: default
          pod: {}
        {{- if not $skipSecondNic }}
        - name: {{ $net.name }}
          multus:
            networkName: {{ $net.name }}
        {{- end }}
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ .name }}-boot
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: {{ .name }}
              ssh_authorized_keys:
                - {{ required "sshKey is required" $root.Values.sshKey }}
            networkData: |
              network:
                version: 2
                ethernets:
                  eth0:
                    dhcp4: true
                  {{- if not $skipSecondNic }}
                  eth1:
                    {{- if .ip }}
                    addresses:
                      - {{ .ip }}/{{ $net.prefixLength | default 24 }}
                    {{- if $net.gateway }}
                    gateway4: {{ $net.gateway }}
                    {{- end }}
                    {{- else }}
                    dhcp4: true
                    {{- end }}
                  {{- end }}
{{- end }}
