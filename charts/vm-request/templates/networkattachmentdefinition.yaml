{{- $_ := required "at least one networks[] entry is required" .Values.networks }}
{{- range .Values.networks }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "networks[].name is required" .name }}
  namespace: {{ required "namespace is required" $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # OVN-Kubernetes native localnet secondary network, no ipam stanza — IP
  # assignment is handled by cloud-init from the request file, not by an
  # in-cluster IPAM plugin. The VLAN's mapping to a physical uplink is
  # configured out-of-band at the node/OVN level (bridge mappings) — this
  # repo does not manage that, same as it never managed node-level Linux
  # bridges under the old cnv-bridge NADs.
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "{{ .name }}",
      "type": "ovn-k8s-cni-overlay",
      "netAttachDefName": "{{ $.Values.namespace }}/{{ .name }}",
      "topology": "localnet"
      {{- if .vlanID }},
      "vlanID": {{ .vlanID }}
      {{- end }}
    }
{{- end }}
