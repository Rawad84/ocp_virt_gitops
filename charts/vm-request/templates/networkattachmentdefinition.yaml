{{- $_ := required "at least one networks[] entry is required" .Values.networks }}
{{- range .Values.networks }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "networks[].name is required" .name }}
  namespace: {{ required "namespace is required" $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # cnv-bridge (OpenShift Virtualization's Linux Bridge CNI addon — confirmed
  # deployed via NetworkAddonsConfig's linuxBridge: {} and the bridge-marker/
  # kube-cni-linux-bridge-plugin daemonsets) attaching to a Linux bridge
  # that's already provisioned on every node via a NodeNetworkConfigurationPolicy
  # (nmstate) — this repo does not manage that bridge itself, same as it
  # never managed node-level VLAN-to-uplink mapping. No ipam stanza — IP
  # assignment is handled by cloud-init from the request file, not by an
  # in-cluster IPAM plugin.
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ .name }}",
      "type": "cnv-bridge",
      "bridge": "{{ required "Values.bridge is required" $.Values.bridge }}"
      {{- if .vlanID }},
      "vlan": {{ .vlanID }}
      {{- end }}
    }
{{- end }}
