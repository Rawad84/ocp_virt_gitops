{{- $_ := required "at least one networks[] entry is required" .Values.networks }}
{{- $clusterName := required "cluster_name is required" .Values.cluster_name }}
{{- $physnet := index .Values.bridges $clusterName }}
{{- if not $physnet }}
  {{- fail (printf "no physical network mapping configured in values.yaml for cluster_name '%s' - add an entry under bridges: (see values.yaml's own comment)" $clusterName) }}
{{- end }}
{{- range .Values.networks }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "networks[].name is required" .name }}
  namespace: {{ required "namespace is required" $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # OVN-Kubernetes native localnet secondary network (type:
  # ovn-k8s-cni-overlay, topology: localnet) - per Red Hat OCP docs
  # ("Configuring multiple networks" > OVN-Kubernetes additional network >
  # localnet topology). physicalNetworkName must match an OVN bridge
  # mapping (ovn-bridge-mappings) already configured on every node of this
  # cluster - provisioned out-of-band (nmstate NodeNetworkConfigurationPolicy
  # setting that external-id, or equivalent), same as this repo never
  # managed the previous cnv-bridge approach's Linux bridge or node-level
  # VLAN-to-uplink mapping either. No ipam stanza — IP assignment is
  # handled by cloud-init from the request file, not by an in-cluster IPAM
  # plugin.
  #
  # Verified live: field names/cniVersion match a working NAD already on
  # this cluster. physicalNetworkName must equal the OVN bridge-mapping
  # NAME (`ovn-bridge-mappings` external-id on each node's OVS), not a
  # bridge/interface name - see values.yaml's bridges: comment and
  # aap/LESSONS_LEARNED.md.
  config: |
    {
      "cniVersion": "0.4.0",
      "name": "{{ .name }}",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "netAttachDefName": "{{ $.Values.namespace }}/{{ .name }}",
      "physicalNetworkName": "{{ $physnet }}"
      {{- if .vlanID }},
      "vlanID": {{ .vlanID }}
      {{- end }}
    }
{{- end }}
