{{- $_ := required "at least one networks[] entry is required" .Values.networks }}
{{- range .Values.networks }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "networks[].name is required" .name }}
  namespace: {{ required "namespace is required" $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Plain L2 bridge binding, no ipam stanza — IP assignment is handled by
  # cloud-init from the request file, not by an in-cluster IPAM plugin.
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "{{ .name }}",
      "type": "cnv-bridge",
      "bridge": "{{ required "networks[].bridge is required" .bridge }}"
      {{- if .vlan }},
      "vlan": {{ .vlan }}
      {{- end }}
    }
{{- end }}
